name: Linting Check

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and Corepack
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Configure Git for HTTPS
        run: |
          # Reescreve SSH -> HTTPS para repositórios públicos do GitHub (sem token, evita erros de autenticação)
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Restore Yarn Cache
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: 0
          YARN_HTTP_TIMEOUT: 600000
          YARN_HTTP_RETRY: 10
        run: yarn install --immutable

      # audit CI-01: `lint:fix` modifies the working tree in place. Running
      # it before `lint` meant `lint` saw the auto-corrected source and the
      # PR was waved through even though the branch as committed still had
      # the errors. We KEEP the auto-fix step here (useful in CI logs to
      # show what's auto-fixable) but gate the build on a no-diff check
      # AFTER it runs, so a PR with un-fixed-on-disk errors fails the gate.
      - name: Auto-fix formatting (informational)
        run: yarn lint:fix
        continue-on-error: true

      - name: Verify tree is clean after auto-fix
        run: |
          if ! git diff --quiet; then
            echo "::error::lint:fix changed files — commit the autoformat fixes locally before opening the PR"
            git diff --stat
            exit 1
          fi

      - name: Check linting
        run: yarn lint
