name: Linting Check

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and Corepack
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Configure Git for HTTPS
        run: |
          # Reescreve SSH -> HTTPS para repositórios públicos do GitHub (sem token, evita erros de autenticação)
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Restore Yarn Cache
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: 0
          YARN_HTTP_TIMEOUT: 600000
          YARN_HTTP_RETRY: 10
        run: yarn install --immutable

      # audit CI-01: `lint:fix` runs `prettier --write` + `eslint --fix` IN PLACE
      # on the working tree. Running it before `lint` meant `lint` then
      # inspected the auto-corrected tree, so any prettier or auto-fixable
      # eslint error in the PR would silently pass CI while the upstream
      # branch still had the error. The lint job is the gate — don't let
      # it heal itself.
      - name: Check linting
        run: yarn lint
