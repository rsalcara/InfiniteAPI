name: E2E Tests

# AUTO-TRIGGERS DISABLED (this fork):
# The mock-server this job needs — ghcr.io/whiskeysockets-devtools/bartender —
# is a PRIVATE upstream package that requires the `BARTENDER_GHCR_TOKEN` secret
# AND read access to that upstream org's package. Neither is available in this
# fork. With the secret empty, the service-container `credentials.password`
# below resolves to '' and GitHub rejects the whole workflow template
# ("Unexpected value ''"), so every `push` to master surfaced a red E2E run
# that never executed a single test. The `push`/`pull_request` triggers are
# therefore removed; the job is kept behind `workflow_dispatch` only, so a
# maintainer who DOES have the bartender secret + image access can still run it
# manually from the Actions tab against any ref.
#
# SECURITY (kept from PR #490 review — GHSL-2021-004): upstream used
# `pull_request_target`, which runs in the BASE-repo context WITH secrets and
# let fork PRs exfiltrate `BARTENDER_GHCR_TOKEN` via postinstall / test code.
# `workflow_dispatch` is maintainer-only (write access required), so that
# exfiltration path stays closed.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch / PR head SHA) to run E2E against. Defaults to the current branch."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only runs on explicit maintainer-triggered workflow_dispatch (trusted —
    # only collaborators with write access can dispatch workflows by default).
    if: github.event_name == 'workflow_dispatch'
    services:
      mock-server:
        image: ghcr.io/whiskeysockets-devtools/bartender:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.BARTENDER_GHCR_TOKEN }}
        ports:
          - 8080:8080
        env:
          CHATSTATE_TTL_SECS: "3"
          ADV_SECRET_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        options: --log-driver none

    steps:
      - name: Checkout (dispatch ref override)
        if: github.event_name == 'workflow_dispatch' && inputs.ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout (default)
        if: github.event_name != 'workflow_dispatch' || inputs.ref == ''
        uses: actions/checkout@v4

      - name: Setup Node.js and Corepack
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Restore Yarn Cache
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Wait for mock server
        run: |
          for i in $(seq 1 30); do
            if curl -sk https://localhost:8080/ > /dev/null 2>&1; then
              echo "Mock server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Mock server failed to become ready"
          exit 1

      - name: Run E2E tests
        env:
          SOCKET_URL: "wss://127.0.0.1:8080/ws/chat"
          ADV_SECRET_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: yarn test:e2e
